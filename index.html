<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <canvas id="gradient-surface" width="500" height="500"></canvas>
    
    <select id="distance-type">
        <option value="euclidean">Euclidean</option>
        <option value="manhattan">Manhattan</option>
        <option value="chebyshev">Chebyshev</option>
        <option value="average-axis">Average Axis</option>
    </select>

    <button onclick="exportGradient()">Export</button>
    <button>Apply to Image</button>

    <p> To add a source for the gradient, click on the canvas, select a color, select a strength, and click ok. To change the method for calculating distance, use the dropdown</p>
    
    <script src="script.js"></script>
</body>
</html>
